# Publish the container image to GHCR when a version tag is pushed.
# A manual run builds the image without pushing it.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:tz

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # A tag that disagrees with package.json would publish a mislabeled image.
      - name: Tag and package.json must agree
        if: github.ref_type == 'tag'
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)" >&2
            exit 1
          fi

      - name: Read the version and short commit
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No latest tag: a deploy names an exact version.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
